# Developer OS — direnv defaults.
# Reference: https://direnv.net/man/direnv.toml.1.html

[global]
# Keep the shell quiet: no per-directory list of exported variables.
hide_env_diff = true

# Warn when an .envrc takes longer than this to evaluate (SDK activation,
# container checks). Raise it per machine if slow projects get noisy.
warn_timeout = "10s"
