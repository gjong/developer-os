# Developer OS — hyprlock (GPU-accelerated lock for Hyprland)
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# Shortcuts: ESC / Ctrl+U / Ctrl+Backspace clear the password buffer.

# Same face family as Waybar (ttf-jetbrains-mono-nerd); falls back via fontconfig if renamed.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 3, easeOutQuint
}

# Blurred live desktop; solid fallback while the screenshot composes.
background {
    monitor =
    path = /usr/share/backgrounds/developer-os/wallpaper.png
    color = rgba(1a1b26ff)
    blur_passes = 3
    blur_size = 8
    brightness = 0.82
    vibrancy = 0.12
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 3
    inner_color = rgba(1a1b26aa)
    outer_color = rgba(7aa2f7ee) rgba(c0caf5ee) 45deg
    check_color = rgba(9ece6aee) rgba(7aa2f7ee) 120deg
    fail_color = rgba(f7768eee) rgba(e0af68ee) 45deg

    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    rounding = 14
    font_family = $font
    placeholder_text = <span foreground="##565f89">Password…</span>
    fail_text = <span foreground="##f7768e">$PAMFAIL</span>

    dots_spacing = 0.32
    position = 0, 72
    halign = center
    valign = center
}

# Clock (updates via hyprlock substitution)
label {
    monitor =
    text = <span weight="bold">$TIME</span>
    color = rgba(c0caf5ff)
    font_size = 64
    font_family = $font

    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B %Y"
    color = rgba(a9b1d6ff)
    font_size = 15
    font_family = $font

    position = 0, -36
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##7aa2f7">$USER</span>
    color = rgba(c0caf5ff)
    font_size = 13
    font_family = $font

    position = 0, 168
    halign = center
    valign = center
}
