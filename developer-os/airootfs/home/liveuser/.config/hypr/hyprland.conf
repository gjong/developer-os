# Developer OS — Hyprland (minimal, documented)
# Docs: https://wiki.hyprland.org/

# Monitor: first output, preferred mode, auto position/scale
monitor=,preferred,auto,auto

# Wayland defaults for Qt / Firefox (GTK uses normal client decorations; window chrome is hyprbars).
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DECORATION,1
env = MOZ_ENABLE_WAYLAND,1

plugin {
    hyprbars {
        enabled = true
        bar_height = 26
        bar_padding = 10
        bar_button_padding = 5
        bar_buttons_alignment = left
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_blur = true
        col.text = rgba(c0caf5ff)
        # Left cluster: close, move to scratchpad (“minimize”), maximize (Hyprland “fullscreen 1”)
        hyprbars-button = rgba(f7768eff), 13, 󰅖, hyprctl dispatch killactive
        hyprbars-button = rgba(e0af68ff), 13, 󰁕, hyprctl dispatch movetoworkspacesilent special
        hyprbars-button = rgba(9ece6aff), 13, 󰘖, hyprctl dispatch fullscreen 1
    }
}

# Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
}

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(7aa2f7ee) rgba(c0caf5ee) 45deg
    col.inactive_border = rgba(1a1b26aa)
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 3
        passes = 2
    }
}

animations {
    enabled = yes
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 4, smooth
    animation = workspaces, 1, 3, smooth
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
}

# Touchpad: 3-finger horizontal swipe switches workspaces (see wiki Configuring/Gestures)
gesture = 3, horizontal, workspace

# App defaults
$terminal = kitty
$menu = rofi -show drun -show-icons -matching fuzzy -sort

# Autostart (Wayland session)
# hyprbars is a Hyprland plugin (hyprland-plugins), built with hyprpm in customize.sh — load first
exec-once = hyprpm reload
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP MOZ_ENABLE_WAYLAND QT_QPA_PLATFORM QT_WAYLAND_DECORATION
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland MOZ_ENABLE_WAYLAND QT_QPA_PLATFORM QT_WAYLAND_DECORATION

# Keybindings (SUPER = main mod)
$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
# Application launcher (Rofi): search installed apps; Waybar grid button runs the same script
bind = $mainMod, D, exec, $menu
# Show windows sent to the special workspace (hyprbars yellow “minimize” button)
bind = $mainMod, grave, togglespecialworkspace, special
bind = $mainMod, Q, killactive,

bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, F, fullscreen, 0

# Session lock (hyprlock reads ~/.config/hypr/hyprlock.conf)
bind = $mainMod, L, exec, hyprlock

# Screenshots (grim + slurp)
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Window rules — use windowrule + match: (windowrulev2 removed in recent Hyprland)
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(thunar)$
