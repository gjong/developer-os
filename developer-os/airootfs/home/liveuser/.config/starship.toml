"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#7c3aed)\
[ </> ](bg:#7c3aed fg:#f8fafc)\
[](bg:#312e81 fg:#7c3aed)\
$directory\
[](fg:#312e81 bg:#1a1d26)\
$git_branch\
$git_status\
[](fg:#1a1d26 bg:#0f1219)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#0f1219 bg:#232733)\
$time\
[ ](fg:#232733)\
\n$character"""

[directory]
style = "fg:#e2e8f0 bg:#312e81"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#1a1d26"
format = '[[ $symbol $branch ](fg:#a5b4fc bg:#1a1d26)]($style)'

[git_status]
style = "bg:#1a1d26"
format = '[[($all_status$ahead_behind )](fg:#a78bfa bg:#1a1d26)]($style)'

[nodejs]
symbol = ""
style = "bg:#0f1219"
format = '[[ $symbol ($version) ](fg:#38bdf8 bg:#0f1219)]($style)'

[rust]
symbol = ""
style = "bg:#0f1219"
format = '[[ $symbol ($version) ](fg:#a78bfa bg:#0f1219)]($style)'

[golang]
symbol = ""
style = "bg:#0f1219"
format = '[[ $symbol ($version) ](fg:#34d399 bg:#0f1219)]($style)'

[php]
symbol = ""
style = "bg:#0f1219"
format = '[[ $symbol ($version) ](fg:#60a5fa bg:#0f1219)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#232733"
format = '[[  $time ](fg:#94a3b8 bg:#232733)]($style)'

[character]
success_symbol = "[❯](bold #7c3aed)"
error_symbol = "[❯](bold #fb7185)"
