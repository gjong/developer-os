# KDE Plasma (Wayland): use native window decorations from the compositor.
linux_display_server wayland
map f1 launch --type=tab

font_family JetBrainsMono Nerd Font
font_size 11
cursor_shape beam
cursor_blink_interval 0.6
window_padding_width 8

# Developer OS 16-color palette (matches Plasma / welcome banner).
foreground #e2e8f0
background #0f1219
cursor #7c3aed
cursor_text_color #ffffff
selection_foreground #e2e8f0
selection_background #312e81

color0 #1a1d26
color1 #fb7185
color2 #34d399
color3 #fbbf24
color4 #60a5fa
color5 #a78bfa
color6 #38bdf8
color7 #cbd5e1
color8 #3b4252
color9 #fda4af
color10 #6ee7b7
color11 #fcd34d
color12 #93c5fd
color13 #c4b5fd
color14 #7dd3fc
color15 #f1f5f9
