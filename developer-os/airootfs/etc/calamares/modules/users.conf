---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: false
    system: true
  - video
  - input
  - audio
  - storage
  - docker

sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
displayAutologin: false
doAutologin: false

passwordRequirements:
  minLength: 1
  maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /usr/bin/zsh
  forbidden_names: [ root, nobody, liveuser, aurbuild, auruser ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "developer-os"
  forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
  fullName:
    editable: true
  loginName:
    value: "developer"
    editable: true
