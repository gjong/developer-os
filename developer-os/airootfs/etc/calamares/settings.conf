---
modules-search: [ local ]

instances:
  - id: developeros-profile
    module: shellprocess
    config: shellprocess-developeros-profile.conf
  - id: prepare-mkinitcpio
    module: shellprocess
    config: shellprocess-prepare-mkinitcpio.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@prepare-mkinitcpio
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - shellprocess@developeros-profile
      - bootloader
      - umount
  - show:
      - finished

branding: developer-os
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
